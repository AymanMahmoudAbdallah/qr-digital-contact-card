<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Connect with us on Facebook or WhatsApp.">
<title>Connect With Us</title>
<style>
  :root{
    --fb:#1877F2; --fb-dark:#0e5fcf;
    --wa:#25D366; --wa-dark:#128C7E;
    --ink:#0f172a; --muted:#475569;
    --card:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 20px calc(20px + env(safe-area-inset-bottom));
    background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#6b8dd6 100%);
    background-attachment:fixed;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
  .hero{text-align:center;color:#fff;animation:rise .6s ease both}
  .hero h1{font-size:clamp(1.7rem,6vw,2.2rem);font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.25)}
  .hero p{margin-top:6px;font-size:1.05rem;opacity:.92;font-weight:500}
  .card{
    background:var(--card);
    border-radius:22px;
    padding:22px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;
    box-shadow:0 12px 32px rgba(15,23,42,.22);
    transition:transform .25s ease,box-shadow .25s ease;
    animation:rise .6s ease both;
  }
  @media (min-width:620px){
    .wrap{max-width:470px}
    .card{flex-direction:row;text-align:left;gap:16px}
  }
  .card.fb{animation-delay:.12s}
  .card.wa{animation-delay:.22s}
  .card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(15,23,42,.28)}
  .icon{
    flex:0 0 54px;height:54px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .icon.fb{background:linear-gradient(160deg,var(--fb),var(--fb-dark))}
  .icon.wa{background:linear-gradient(160deg,var(--wa),var(--wa-dark))}
  .icon svg{width:30px;height:30px;fill:currentColor}
  .card .txt{flex:1;min-width:0}
  .card .txt b{display:block;font-size:1.02rem;font-weight:700}
  .card .txt span{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    width:100%;padding:13px 18px;border-radius:999px;
    font-size:.95rem;font-weight:700;text-decoration:none;color:#fff;
    transition:filter .2s ease,transform .15s ease;
    box-shadow:0 6px 16px rgba(15,23,42,.18);
  }
  @media (min-width:620px){
    .btn{width:auto;flex:0 0 auto;font-size:.86rem;padding:11px 15px}
  }
  .btn.fb{background:linear-gradient(160deg,var(--fb),var(--fb-dark))}
  .btn.wa{background:linear-gradient(160deg,var(--wa),var(--wa-dark))}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:scale(.96)}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
  footer{
    margin-top:26px;text-align:center;color:rgba(255,255,255,.85);
    font-size:.85rem;font-weight:500;animation:rise .6s .3s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  @media (max-height:480px){
    body{justify-content:flex-start;padding-top:18px}
    .wrap{gap:12px}
    footer{margin-top:14px}
  }
</style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <h1>Welcome</h1>
      <p>Connect with us</p>
    </header>

    <section class="card fb" aria-label="Facebook contact">
      <div class="icon fb" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      </div>
      <div class="txt">
        <b>Facebook</b>
        <span>Follow our page for updates</span>
      </div>
      <a class="btn fb" href="https://www.facebook.com/share/1BZMUfftta/" target="_blank" rel="noopener noreferrer" aria-label="Visit Our Facebook Page">Visit Our Facebook Page</a>
    </section>

    <section class="card wa" aria-label="WhatsApp contact">
      <div class="icon wa" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      </div>
      <div class="txt">
        <b>WhatsApp</b>
        <span>Chat with us directly</span>
      </div>
      <a class="btn wa" href="https://wa.me/201097872574" target="_blank" rel="noopener noreferrer" aria-label="Contact Us on WhatsApp">Contact Us on WhatsApp</a>
    </section>
  </main>
  <footer>Thank you for connecting with us.</footer>
</body>
</html>
