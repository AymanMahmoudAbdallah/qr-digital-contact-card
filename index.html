<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Connect with us on Facebook or WhatsApp.">
<title>Connect With Us</title>
<style>
  :root{
    --fb:#1877F2; --fb-dark:#0e5fcf;
    --wa:#25D366; --wa-dark:#128C7E;
    --brown:#6b4a1f; --brown-soft:#8a6a35;
    --gold:#c9a227; --gold-deep:#a9821a;
    --card:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%}
  body{height:auto}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(44px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
    background:linear-gradient(160deg,#faf3df 0%,#f3e5c0 55%,#ecd7a6 100%);
    background-attachment:fixed;
    color:var(--brown);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
  .hero{text-align:center;animation:rise .6s ease both}
  .logo{
    width:150px;height:150px;border-radius:50%;
    object-fit:cover;display:block;margin:0 auto;
    border:4px solid var(--gold);
    outline:2px solid rgba(169,130,26,.35);outline-offset:3px;
    box-shadow:0 10px 26px rgba(107,74,31,.28);
    background:#fdf6e3;
  }
  .hero .tagline{
    margin-top:16px;font-size:1.05rem;font-weight:700;color:var(--brown);
    letter-spacing:.01em;
  }
  .card{
    background:var(--card);
    border-radius:22px;
    padding:22px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;
    box-shadow:0 12px 32px rgba(107,74,31,.16);
    border:1px solid rgba(201,162,39,.18);
    transition:transform .25s ease,box-shadow .25s ease;
    animation:rise .6s ease both;
  }
  @media (min-width:620px){
    .wrap{max-width:470px}
    .card{flex-direction:row;text-align:left;gap:16px}
  }
  .card.fb{animation-delay:.12s}
  .card.wa{animation-delay:.22s}
  .card.menu{animation-delay:.32s}
  .card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(107,74,31,.22)}
  .icon{
    flex:0 0 auto;width:54px;height:54px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .icon.fb{background:linear-gradient(160deg,var(--fb),var(--fb-dark))}
  .icon.wa{background:linear-gradient(160deg,var(--wa),var(--wa-dark))}
  .icon.menu{background:linear-gradient(160deg,var(--gold),var(--gold-deep))}
  .icon svg{width:30px;height:30px;fill:currentColor}
  .card .txt{flex:1;min-width:0}
  .card .txt b{display:block;font-size:1.02rem;font-weight:700;color:#3d2f14}
  .card .txt span{display:block;font-size:.82rem;color:var(--brown-soft);margin-top:2px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    width:100%;padding:13px 18px;border-radius:999px;
    font-size:.95rem;font-weight:700;text-decoration:none;color:#fff;
    transition:filter .2s ease,transform .15s ease;
    box-shadow:0 6px 16px rgba(107,74,31,.18);
  }
  @media (min-width:620px){
    .btn{width:auto;flex:0 0 auto;font-size:.86rem;padding:11px 15px}
  }
  .btn.fb{background:linear-gradient(160deg,var(--fb),var(--fb-dark))}
  .btn.wa{background:linear-gradient(160deg,var(--wa),var(--wa-dark))}
  .btn.menu{background:linear-gradient(160deg,var(--gold),var(--gold-deep))}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:scale(.96)}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  footer{
    margin-top:26px;text-align:center;color:var(--brown-soft);
    font-size:.85rem;font-weight:600;animation:rise .6s .3s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  @media (max-height:480px){
    body{justify-content:flex-start;padding-top:32px}
    .wrap{gap:12px}
    .logo{width:110px;height:110px}
    footer{margin-top:14px}
  }
</style>
</head>
