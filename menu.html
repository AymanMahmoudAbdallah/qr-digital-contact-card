<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="منيو منتجات آل البيت لعسل النحل.">
<title>المنيو | آل البيت</title>
<style>
  :root{
    --brown:#6b4a1f; --brown-soft:#8a6a35;
    --gold:#c9a227; --gold-deep:#a9821a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;
    background:linear-gradient(160deg,#faf3df 0%,#f3e5c0 55%,#ecd7a6 100%);
    background-attachment:fixed;
    color:var(--brown);
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:center;
    padding:14px 16px;
    background:rgba(250,243,223,.92);
    border-bottom:1px solid rgba(201,162,39,.25);
  }
  .topbar h1{font-size:1.15rem;font-weight:800;color:#3d2f14}
  .back{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:12px;
    color:var(--brown);text-decoration:none;
    transition:background .2s ease;
  }
  .back:hover{background:rgba(201,162,39,.15)}
  .back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .back svg{width:22px;height:22px;fill:currentColor}
  main{
    width:100%;max-width:520px;margin:0 auto;
    padding:20px 16px calc(24px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:14px;
  }
  .menu-card{
    display:block;background:#fff;border-radius:22px;padding:10px;
    box-shadow:0 12px 32px rgba(107,74,31,.16);
    border:1px solid rgba(201,162,39,.18);
    animation:rise .6s ease both;
  }
  .menu-card img{display:block;width:100%;height:auto;border-radius:14px}
  .caption{
    margin:0;text-align:center;color:var(--brown-soft);
    font-size:.9rem;font-weight:600;
    animation:rise .6s .15s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <header class="topbar">
    <h1>المنيو</h1>
    <a class="back" href="index.html" aria-label="رجوع">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41Z"/></svg>
    </a>
  </header>
  <main>
    <a class="menu-card" href="menu.jpg" aria-label="افتح صورة المنيو بحجمها الكامل">
      <img src="menu.jpg" alt="منيو منتجات آل البيت لمنتجات عسل النحل" width="860" height="2615">
    </a>
    <p class="caption">طبيعة نقية .. لصحة أفضل</p>
  </main>
</body>
</html>
